apiVersion: v1
kind: Service
metadata:
  name: hft-exchange
  labels:
    app: hft-exchange
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: websocket
  selector:
    app: hft-exchange
---
apiVersion: v1
kind: Service
metadata:
  name: hft-exchange-headless
  labels:
    app: hft-exchange
spec:
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: hft-exchange
